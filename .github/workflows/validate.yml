name: HOLLOWEARTH CI and Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Godot 4.5.1 headless validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot 4.5.1
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /opt/godot
          chmod +x /opt/godot/Godot_v4.5.1-stable_linux.x86_64
          ln -sf /opt/godot/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Show revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short
      - name: Validate project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f export_presets.cfg
          godot --version
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Runtime smoke test
        run: timeout 20s godot --headless --path . --quit-after 5

  android-build:
    name: Android ARM64 APK
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot 4.5.1
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /opt/godot
          chmod +x /opt/godot/Godot_v4.5.1-stable_linux.x86_64
          ln -sf /opt/godot/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Android export prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig unzip curl
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          mkdir -p "$HOME/android-sdk/cmdline-tools" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -fL --retry 3 -o /tmp/android-cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p /tmp/android-cli
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cli
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          cp -a /tmp/android-cli/cmdline-tools/. "$HOME/android-sdk/cmdline-tools/latest/"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          curl -fL --retry 3 -o /tmp/godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -o /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
      - name: Verify Godot and export prerequisites
        run: |
          godot --version
          java -version
          test -f export_presets.cfg
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          mkdir -p "$HOME/.config/godot" build
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '[resource]' "export/android/android_sdk_path = \"$ANDROID_HOME\"" "export/android/java_sdk_path = \"$JAVA_HOME\"" "export/android/ndk_path = \"$ANDROID_HOME/ndk/28.1.13356709\"" > "$HOME/.config/godot/editor_settings-4.5.tres"
          cat "$HOME/.config/godot/editor_settings-4.5.tres"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          godot --headless --editor --path . --quit --verbose
      - name: Export Android APK
        run: godot --headless --editor --verbose --path . --export-debug "Android" build/HOLLOWEARTH-debug.apk
      - name: Verify APK output
        run: |
          test -s build/HOLLOWEARTH-debug.apk
          file build/HOLLOWEARTH-debug.apk
          stat -c 'APK_SIZE_BYTES=%s' build/HOLLOWEARTH-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOLLOWEARTH-debug-apk
          path: build/HOLLOWEARTH-debug.apk
          if-no-files-found: error
          retention-days: 14
