name: HOLLOWEARTH CI and Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Godot 4.5.1 headless validation
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short
      - name: Validate project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f export_presets.cfg
          godot --version
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Runtime smoke test
        run: timeout 20s godot --headless --path . --quit-after 5

  android-build:
    name: Android ARM64 APK
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Android export prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk fontconfig unzip curl
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          mkdir -p /usr/lib/android-sdk/cmdline-tools "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -fL --retry 3 -o /tmp/android-cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p /tmp/android-cli
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cli
          mkdir -p /usr/lib/android-sdk/cmdline-tools/latest
          cp -a /tmp/android-cli/cmdline-tools/. /usr/lib/android-sdk/cmdline-tools/latest/
          yes | /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/lib/android-sdk --licenses >/dev/null
          /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/lib/android-sdk "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          curl -fL --retry 3 -o /tmp/godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -o /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
      - name: Verify Godot and export prerequisites
        run: |
          godot --version
          java -version
          test -f export_presets.cfg
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
          test -d "$ANDROID_HOME/platform-tools"
          mkdir -p "$HOME/.config/godot" build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          godot --headless --editor --path . --quit --verbose
      - name: Export Android APK
        run: godot --headless --editor --verbose --path . --export-debug "Android" build/HOLLOWEARTH-debug.apk
      - name: Verify APK output
        run: |
          test -s build/HOLLOWEARTH-debug.apk
          file build/HOLLOWEARTH-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOLLOWEARTH-debug-apk
          path: build/HOLLOWEARTH-debug.apk
          if-no-files-found: error
          retention-days: 14
